[project]
name = "rag"
version = "0.1.0"
description = "Modular hybrid retrieval-augmented generation pipeline with FastAPI and Qdrant"
readme = "README.md"
authors = [
    { name = "SiddharthSharabu-1729", email = "siddharthsharabu125@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
